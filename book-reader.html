<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Book Reader | Bethesda Bible Institute</title>
  <meta name="description" content="Read your complete theological books and textbooks online with realistic page turning and automatic progress saving at Bethesda Bible Institute Hyderabad.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --reader-bg: #0f172a;
      --book-cover-color: #276749; /* Deep academic green matching user reference */
      --book-page-bg: #fdfbf7;   /* Warm antique paper */
      --book-shadow: rgba(0, 0, 0, 0.45);
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--reader-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #readerApp {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Reader Header */
    .reader-header {
      height: 56px;
      background: #1e293b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      color: #FFFFFF;
      z-index: 40;
      flex-shrink: 0;
    }
    .reader-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }
    .btn-reader-back {
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-reader-back:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .reader-book-info {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .reader-book-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFFFFF;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-book-author {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .reader-header-center {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .reader-progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .reader-progress-bar {
      width: 70px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }
    .reader-progress-fill {
      height: 100%;
      background: #c5a059;
      width: 0%;
      transition: width 0.3s;
    }
    .reader-progress-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: #c5a059;
    }
    .reader-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tool-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
    }

    /* Main Reader Viewport */
    .reader-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: auto;
      padding: 1rem 0;
      perspective: 2400px;
    }

    /* 3D Physical Open Book Structure (matches user's green book image) */
    .physical-book {
      position: relative;
      background: var(--book-cover-color);
      border-radius: 12px;
      padding: 14px 16px 16px 14px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 10px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      max-width: 95vw;
      max-height: calc(100vh - 140px);
      box-sizing: border-box;
      transition: transform 0.3s;
    }
    .book-pages-wrapper {
      display: flex;
      background: var(--book-page-bg);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.08);
    }
    .book-spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 32px;
      transform: translateX(-50%);
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.18) 0%,
        rgba(0, 0, 0, 0.08) 35%,
        rgba(0, 0, 0, 0.02) 50%,
        rgba(0, 0, 0, 0.08) 65%,
        rgba(0, 0, 0, 0.18) 100%
      );
      pointer-events: none;
      z-index: 10;
    }
    .book-left-page, .book-right-page {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--book-page-bg);
      position: relative;
      overflow: hidden;
      min-width: 280px;
      min-height: 400px;
    }
    .book-left-page {
      box-shadow: inset -15px 0 20px -10px rgba(0, 0, 0, 0.12);
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }
    .book-right-page {
      box-shadow: inset 15px 0 20px -10px rgba(0, 0, 0, 0.12);
    }
    .book-page-canvas {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: calc(100vh - 180px);
    }

    /* Page Turn Turning Leaf (3D Curl Effect) */
    .page-turn-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(245,245,245,0.9) 100%);
      box-shadow: -15px 15px 30px rgba(0, 0, 0, 0.35);
      transform-origin: left center;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s;
      pointer-events: none;
      z-index: 20;
      display: none;
    }
    .page-turn-overlay.flipping-next {
      display: block;
      animation: curlPageForward 0.6s ease-in-out forwards;
    }
    .page-turn-overlay.flipping-prev {
      display: block;
      left: 0;
      right: auto;
      transform-origin: right center;
      animation: curlPageBackward 0.6s ease-in-out forwards;
    }
    @keyframes curlPageForward {
      0% {
        transform: rotateY(0deg) skewY(0deg);
        box-shadow: 0 0 0 rgba(0,0,0,0);
      }
      50% {
        transform: rotateY(-70deg) skewY(-3deg) scale(0.98);
        box-shadow: -20px 20px 40px rgba(0,0,0,0.4);
      }
      100% {
        transform: rotateY(-180deg) skewY(0deg);
        box-shadow: 0 0 0 rgba(0,0,0,0);
        opacity: 0;
      }
    }
    @keyframes curlPageBackward {
      0% {
        transform: rotateY(0deg) skewY(0deg);
      }
      50% {
        transform: rotateY(70deg) skewY(3deg) scale(0.98);
        box-shadow: 20px 20px 40px rgba(0,0,0,0.4);
      }
      100% {
        transform: rotateY(180deg) skewY(0deg);
        opacity: 0;
      }
    }

    /* Page Navigation Click Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .nav-arrow:hover {
      background: #c5a059;
      color: #1a050b;
      transform: translateY(-50%) scale(1.08);
    }
    .nav-arrow.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    .nav-arrow-left { left: 24px; }
    .nav-arrow-right { right: 24px; }

    /* Bottom Control Bar */
    .reader-footer {
      height: 60px;
      background: #1e293b;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 0 1.5rem;
      color: #cbd5e1;
      z-index: 40;
      flex-shrink: 0;
    }
    .page-jump-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .page-input {
      width: 50px;
      padding: 0.3rem 0.4rem;
      text-align: center;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: #FFFFFF;
      font-weight: 700;
    }

    /* Table of Contents / Outline Drawer */
    .reader-drawer {
      position: fixed;
      top: 56px;
      bottom: 60px;
      left: 0;
      width: 320px;
      background: #1e293b;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .reader-drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }
    .toc-item {
      display: block;
      padding: 0.6rem 0.85rem;
      color: #cbd5e1;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: background 0.15s;
      cursor: pointer;
    }
    .toc-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #c5a059;
    }

    /* Loading Overlay */
    .reader-loading {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      z-index: 60;
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(197, 160, 89, 0.2);
      border-top-color: #c5a059;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Single Page Mode */
    @media (max-width: 768px) {
      .book-left-page {
        display: none !important;
      }
      .book-spine-crease {
        display: none;
      }
      .physical-book {
        padding: 8px;
        border-radius: 8px;
      }
      .nav-arrow {
        width: 40px;
        height: 40px;
      }
      .nav-arrow-left { left: 8px; }
      .nav-arrow-right { right: 8px; }
      .reader-progress-wrap {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="readerApp">
    <!-- Header -->
    <header class="reader-header">
      <div class="reader-header-left">
        <a href="student-dashboard.html" class="btn-reader-back" title="Return to My Library">
          ← Back to Library
        </a>
        <div class="reader-book-info">
          <span id="readerBookTitle" class="reader-book-title">Loading Book...</span>
          <span id="readerBookAuthor" class="reader-book-author">Bethesda Bible Institute</span>
        </div>
      </div>

      <div class="reader-header-center">
        <div class="reader-progress-wrap">
          <span style="font-size:0.75rem; color:#94a3b8;">Reading Progress:</span>
          <div class="reader-progress-bar">
            <div id="readerProgressFill" class="reader-progress-fill"></div>
          </div>
          <span id="readerProgressText" class="reader-progress-text">0%</span>
        </div>
      </div>

      <div class="reader-header-right">
        <button type="button" id="btnToggleToc" class="tool-btn" title="Table of Contents">
          📑 Contents
        </button>
        <button type="button" id="btnZoomOut" class="tool-btn" title="Zoom Out">
          🔍−
        </button>
        <button type="button" id="btnZoomIn" class="tool-btn" title="Zoom In">
          🔍+
        </button>
        <button type="button" id="btnToggleFullscreen" class="tool-btn" title="Fullscreen">
          ⛶ Fullscreen
        </button>
      </div>
    </header>

    <!-- Reader Main Viewport -->
    <main class="reader-viewport" id="viewport">
      <!-- Nav Arrows -->
      <button type="button" id="btnPrevPage" class="nav-arrow nav-arrow-left" title="Previous Page (Left Arrow)">
        ◀
      </button>
      <button type="button" id="btnNextPage" class="nav-arrow nav-arrow-right" title="Next Page (Right Arrow)">
        ▶
      </button>

      <!-- Physical Open Book Container (Academic Green Hardcover Binding) -->
      <div class="physical-book" id="physicalBook">
        <div class="book-pages-wrapper">
          <!-- Central Spine Shadow -->
          <div class="book-spine-crease"></div>

          <!-- Left Page -->
          <div class="book-left-page" id="leftPageBox">
            <canvas id="canvasLeft" class="book-page-canvas"></canvas>
          </div>

          <!-- Right Page -->
          <div class="book-right-page" id="rightPageBox">
            <canvas id="canvasRight" class="book-page-canvas"></canvas>
          </div>

          <!-- 3D Page Turn Leaf Overlay -->
          <div id="pageTurnOverlay" class="page-turn-overlay"></div>
        </div>
      </div>

      <!-- Loading State -->
      <div id="readerLoading" class="reader-loading">
        <div class="loading-spinner"></div>
        <p style="font-weight:600; font-size:1.05rem; margin-bottom:0.25rem;">Opening Book in 3D Reader...</p>
        <p style="font-size:0.85rem; color:#94a3b8;">Verifying active enrollment and streaming authorized pages</p>
      </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="reader-footer">
      <div class="page-jump-control">
        <span>Page</span>
        <input type="number" id="inputCurrentPage" class="page-input" min="1" value="1">
        <span>of <strong id="labelTotalPages" style="color:#FFFFFF;">—</strong></span>
      </div>

      <div style="display:flex; gap:0.5rem;">
        <button type="button" id="btnFooterPrev" class="tool-btn">◀ Previous</button>
        <button type="button" id="btnFooterNext" class="tool-btn">Next ▶</button>
      </div>
    </footer>

    <!-- Outline / TOC Drawer -->
    <aside id="readerDrawer" class="reader-drawer">
      <div class="drawer-header">
        <span>Table of Contents</span>
        <button type="button" id="btnCloseDrawer" style="background:none; border:none; color:#cbd5e1; font-size:1.1rem; cursor:pointer;">✕</button>
      </div>
      <div class="drawer-content" id="tocContainer">
        <p style="font-size:0.85rem; color:#94a3b8; text-align:center; padding:2rem 0;">No outline found in this document.</p>
      </div>
    </aside>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/courses.js"></script>
  <script>
    // Set PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');

      if (!bookId) {
        alert('No book ID specified. Returning to student dashboard.');
        window.location.href = 'student-dashboard.html';
        return;
      }

      // Check student authentication
      const token = getAuthToken();
      if (!token) {
        alert('Student authentication required to read enrolled books.');
        window.location.href = `student-login.html?returnUrl=${encodeURIComponent(window.location.href)}`;
        return;
      }

      const canvasLeft = document.getElementById('canvasLeft');
      const canvasRight = document.getElementById('canvasRight');
      const leftCtx = canvasLeft.getContext('2d');
      const rightCtx = canvasRight.getContext('2d');

      let pdfDoc = null;
      let currentPage = 1;
      let totalPages = 1;
      let zoomScale = 1.0;
      let isRendering = false;
      let saveProgressTimer = null;

      // Fetch Book metadata
      try {
        const bookData = await fetchCourseDetailLive(bookId);
        if (bookData) {
          document.getElementById('readerBookTitle').textContent = bookData.title || 'eBook Reader';
          document.getElementById('readerBookAuthor').textContent = `By ${bookData.author || 'Bethesda Bible Faculty'}`;
          document.title = `${bookData.title} | Online Book Reader`;
        }
      } catch (e) {}

      // Fetch student's saved reading progress
      try {
        const progress = await apiFetchBookProgress(bookId);
        if (progress && progress.lastReadPage > 0) {
          currentPage = progress.lastReadPage;
        }
      } catch (e) {}

      // Load PDF document securely with Bearer token
      try {
        const pdfStreamUrl = apiGetStudentBookPdfUrl(bookId);
        const loadingTask = pdfjsLib.getDocument({
          url: pdfStreamUrl,
          httpHeaders: {
            Authorization: `Bearer ${token}`
          },
          withCredentials: true,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true,
        });

        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;
        document.getElementById('labelTotalPages').textContent = totalPages;
        document.getElementById('inputCurrentPage').max = totalPages;

        if (currentPage > totalPages) currentPage = totalPages;

        // Render TOC if present
        try {
          const outline = await pdfDoc.getOutline();
          renderOutline(outline);
        } catch (e) {}

        // Hide loading
        document.getElementById('readerLoading').style.display = 'none';

        // Render current spread
        await renderSpread(currentPage);
      } catch (err) {
        document.getElementById('readerLoading').innerHTML = `
          <div style="text-align:center; max-width:440px; padding:2rem;">
            <div style="font-size:3rem; margin-bottom:1rem;">⚠️</div>
            <h3 style="color:#FFF; font-size:1.35rem; margin-bottom:0.75rem;">Access Restricted</h3>
            <p style="color:#cbd5e1; font-size:0.95rem; line-height:1.5; margin-bottom:1.5rem;">
              ${err.message || 'You must be enrolled in this book course to read the full content.'}
            </p>
            <a href="book-details.html?id=${encodeURIComponent(bookId)}" class="btn btn-gold btn-md">
              Purchase or Enroll in Book
            </a>
          </div>
        `;
      }

      // Check viewport mode: Dual page on desktop vs Single page on mobile
      function isDualPageMode() {
        return window.innerWidth >= 768;
      }

      async function renderPageToCanvas(pageNum, canvas, ctx) {
        if (!pdfDoc || pageNum < 1 || pageNum > totalPages) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.width = 400;
          canvas.height = 550;
          ctx.fillStyle = '#fdfbf7';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          return;
        }

        const page = await pdfDoc.getPage(pageNum);
        const baseViewport = page.getViewport({ scale: 1.0 });

        // Calculate responsive scale based on viewport height
        const targetHeight = Math.max(380, window.innerHeight - 200) * zoomScale;
        const scale = targetHeight / baseViewport.height;
        const viewport = page.getViewport({ scale });

        const outputScale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        await page.render({
          canvasContext: ctx,
          transform,
          viewport,
        }).promise;
      }

      async function renderSpread(targetPage) {
        if (isRendering || !pdfDoc) return;
        isRendering = true;

        const dual = isDualPageMode();
        let leftPageNum, rightPageNum;

        if (dual) {
          // Open book spread: odd page on left, even on right (or 1 on right like a title page)
          if (targetPage === 1) {
            leftPageNum = 0; // Blank or inside cover
            rightPageNum = 1;
          } else if (targetPage % 2 === 0) {
            leftPageNum = targetPage;
            rightPageNum = targetPage + 1 <= totalPages ? targetPage + 1 : 0;
          } else {
            leftPageNum = targetPage - 1;
            rightPageNum = targetPage;
          }
          document.getElementById('leftPageBox').style.display = 'flex';
        } else {
          leftPageNum = 0;
          rightPageNum = targetPage;
          document.getElementById('leftPageBox').style.display = 'none';
        }

        try {
          if (dual && leftPageNum > 0) {
            await renderPageToCanvas(leftPageNum, canvasLeft, leftCtx);
          } else if (dual) {
            leftCtx.fillStyle = '#fdfbf7';
            leftCtx.fillRect(0, 0, canvasLeft.width, canvasLeft.height);
          }

          await renderPageToCanvas(rightPageNum, canvasRight, rightCtx);
        } catch (e) {
          console.error('Error rendering page spread:', e);
        } finally {
          isRendering = false;
        }

        // Update UI counters
        currentPage = targetPage;
        document.getElementById('inputCurrentPage').value = currentPage;
        const pct = Math.min(100, Math.round((currentPage / totalPages) * 100));
        document.getElementById('readerProgressFill').style.width = `${pct}%`;
        document.getElementById('readerProgressText').textContent = `${pct}%`;

        // Update arrow states
        document.getElementById('btnPrevPage').classList.toggle('disabled', currentPage <= 1);
        document.getElementById('btnNextPage').classList.toggle('disabled', currentPage >= totalPages);

        // Schedule auto-saving reading progress
        scheduleAutoSave(currentPage);
      }

      function scheduleAutoSave(page) {
        if (saveProgressTimer) clearTimeout(saveProgressTimer);
        saveProgressTimer = setTimeout(async () => {
          try {
            await apiSaveBookProgress(bookId, { lastReadPage: page, totalPages });
          } catch (e) {}
        }, 1200);
      }

      // 3D Page Turn Navigation
      async function flipNext() {
        if (currentPage >= totalPages) return;
        const overlay = document.getElementById('pageTurnOverlay');
        overlay.className = 'page-turn-overlay flipping-next';

        const step = isDualPageMode() && currentPage > 1 ? 2 : 1;
        const target = Math.min(totalPages, currentPage + step);

        setTimeout(async () => {
          await renderSpread(target);
          overlay.className = 'page-turn-overlay';
        }, 300);
      }

      async function flipPrev() {
        if (currentPage <= 1) return;
        const overlay = document.getElementById('pageTurnOverlay');
        overlay.className = 'page-turn-overlay flipping-prev';

        const step = isDualPageMode() && currentPage > 2 ? 2 : 1;
        const target = Math.max(1, currentPage - step);

        setTimeout(async () => {
          await renderSpread(target);
          overlay.className = 'page-turn-overlay';
        }, 300);
      }

      // Event Listeners
      document.getElementById('btnNextPage').addEventListener('click', flipNext);
      document.getElementById('btnPrevPage').addEventListener('click', flipPrev);
      document.getElementById('btnFooterNext').addEventListener('click', flipNext);
      document.getElementById('btnFooterPrev').addEventListener('click', flipPrev);

      // Keyboard arrow navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          flipNext();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          flipPrev();
        }
      });

      // Jump to page input
      const inputPage = document.getElementById('inputCurrentPage');
      inputPage.addEventListener('change', () => {
        let val = parseInt(inputPage.value, 10);
        if (isNaN(val)) val = 1;
        val = Math.max(1, Math.min(totalPages, val));
        renderSpread(val);
      });

      // Zoom controls
      document.getElementById('btnZoomIn').addEventListener('click', () => {
        zoomScale = Math.min(2.0, zoomScale + 0.15);
        renderSpread(currentPage);
      });
      document.getElementById('btnZoomOut').addEventListener('click', () => {
        zoomScale = Math.max(0.65, zoomScale - 0.15);
        renderSpread(currentPage);
      });

      // Fullscreen toggle
      document.getElementById('btnToggleFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // Table of Contents Drawer
      const drawer = document.getElementById('readerDrawer');
      document.getElementById('btnToggleToc').addEventListener('click', () => {
        drawer.classList.toggle('open');
      });
      document.getElementById('btnCloseDrawer').addEventListener('click', () => {
        drawer.classList.remove('open');
      });

      function renderOutline(outline) {
        const container = document.getElementById('tocContainer');
        if (!outline || outline.length === 0) return;
        container.innerHTML = outline.map(item => {
          return `
            <a class="toc-item" data-dest="${item.dest || ''}">
              ${item.title}
            </a>
          `;
        }).join('');

        container.querySelectorAll('.toc-item').forEach((el, idx) => {
          el.addEventListener('click', async () => {
            drawer.classList.remove('open');
            try {
              const dest = outline[idx].dest;
              if (dest) {
                const pageRef = typeof dest === 'string' ? await pdfDoc.getDestination(dest) : dest;
                if (pageRef && pageRef[0]) {
                  const pageIndex = await pdfDoc.getPageIndex(pageRef[0]);
                  renderSpread(pageIndex + 1);
                }
              }
            } catch (e) {}
          });
        });
      }

      // Save on window unload
      window.addEventListener('beforeunload', () => {
        if (currentPage > 0) {
          navigator.sendBeacon?.(
            `${BIBLE_LMS_API_BASE}/students/books/${encodeURIComponent(bookId)}/progress`,
            JSON.stringify({ lastReadPage: currentPage, totalPages })
          );
        }
      });

      // Resize listener
      window.addEventListener('resize', () => {
        renderSpread(currentPage);
      });
    });
  </script>
</body>
</html>
