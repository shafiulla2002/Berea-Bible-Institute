<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Book Reader | Bethesda Bible Institute</title>
  <meta name="description" content="Read your complete theological books and textbooks online with realistic page turning and automatic progress saving at Bethesda Bible Institute Hyderabad.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --reader-bg: #f8fafc;
      --book-cover-color: #2f732c; /* Classic forest green hardcover matching reference */
      --book-cover-edge: #21541f;
      --book-page-bg: #ffffff;
      --book-shadow: rgba(15, 23, 42, 0.22);
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f1f5f9 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #readerApp {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Reader Header */
    .reader-header {
      height: 54px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      color: #1e293b;
      z-index: 40;
      flex-shrink: 0;
    }
    .reader-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }
    .btn-reader-back {
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-reader-back:hover {
      background: #e2e8f0;
    }
    .reader-book-info {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .reader-book-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-book-author {
      font-size: 0.75rem;
      color: #64748b;
    }
    .reader-header-center {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .reader-progress-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: #f8fafc;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }
    .reader-progress-wrap > span:first-child {
      color: #475569 !important;
    }
    .reader-progress-bar {
      width: 70px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }
    .reader-progress-fill {
      height: 100%;
      background: #2f732c;
      width: 0%;
      transition: width 0.3s;
    }
    .reader-progress-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: #2f732c;
    }
    .reader-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tool-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .tool-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
    }

    /* Main Reader Viewport */
    .reader-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: auto;
      padding: 1.25rem 0;
      perspective: 2400px;
    }

    /* 3D Physical Open Book Structure (Green Hardcover + Layered Page Stack) */
    .physical-book {
      position: relative;
      background: linear-gradient(180deg, #378334 0%, var(--book-cover-color) 15%, #286425 85%, #20521e 100%);
      border: 1px solid var(--book-cover-edge);
      border-radius: 4px;
      padding: 8px 11px 10px 11px;
      box-shadow:
        0 26px 55px rgba(15, 23, 42, 0.24),
        0 10px 22px rgba(15, 23, 42, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      display: flex;
      max-width: 95vw;
      max-height: calc(100vh - 135px);
      box-sizing: border-box;
      transition: transform 0.3s;
    }
    .book-pages-wrapper {
      display: flex;
      background: var(--book-page-bg);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
      /* Realistic stacked paper edge effect on left, right & bottom */
      box-shadow:
        -3px 0 0 #e5e7eb,
        -5px 0 0 #d1d5db,
        3px 0 0 #e5e7eb,
        5px 0 0 #d1d5db,
        0 3px 0 #e5e7eb,
        0 5px 0 #d1d5db,
        0 2px 10px rgba(0, 0, 0, 0.22);
    }
    .book-spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 44px;
      transform: translateX(-50%);
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.05) 28%,
        rgba(0, 0, 0, 0.16) 46%,
        rgba(0, 0, 0, 0.24) 50%,
        rgba(0, 0, 0, 0.14) 54%,
        rgba(0, 0, 0, 0.04) 72%,
        rgba(0, 0, 0, 0) 100%
      );
      pointer-events: none;
      z-index: 12;
    }
    .book-left-page, .book-right-page {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--book-page-bg);
      position: relative;
      overflow: hidden;
      min-width: 280px;
      min-height: 400px;
      cursor: pointer;
    }
    .book-left-page {
      box-shadow: inset -18px 0 28px -14px rgba(0, 0, 0, 0.14);
    }
    .book-right-page {
      box-shadow: inset 18px 0 28px -14px rgba(0, 0, 0, 0.14);
    }
    .book-page-canvas {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: calc(100vh - 175px);
    }

    /* Interactive Bottom-Right Corner Peel Hint (matches reference screenshot) */
    .page-corner-peel {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 42px;
      height: 42px;
      background: linear-gradient(
        135deg,
        transparent 48%,
        rgba(0, 0, 0, 0.12) 49%,
        #f8fafc 52%,
        #e2e8f0 78%,
        #cbd5e1 100%
      );
      box-shadow: -3px -3px 10px rgba(0, 0, 0, 0.16);
      border-top-left-radius: 6px;
      pointer-events: auto;
      cursor: pointer;
      z-index: 15;
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1), height 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
    }
    .book-right-page:hover .page-corner-peel,
    .page-corner-peel:hover {
      width: 68px;
      height: 68px;
      box-shadow: -6px -6px 16px rgba(0, 0, 0, 0.24);
    }
    .page-corner-peel::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, transparent 50%, rgba(255, 255, 255, 0.55) 52%, transparent 72%);
      pointer-events: none;
    }
    .page-corner-peel.hidden {
      display: none;
    }

    /* Page Turn Turning Leaf (Realistic 3D Curl Effect) */
    .page-turn-overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 50%;
      background: linear-gradient(
        90deg,
        rgba(226, 232, 240, 0.96) 0%,
        #ffffff 12%,
        #f8fafc 85%,
        #e2e8f0 100%
      );
      box-shadow: -18px 8px 34px rgba(15, 23, 42, 0.28);
      transform-origin: left center;
      pointer-events: none;
      z-index: 25;
      display: none;
    }
    .page-turn-overlay.flipping-next {
      display: block;
      animation: curlPageForward 0.52s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .page-turn-overlay.flipping-prev {
      display: block;
      left: 0;
      right: auto;
      transform-origin: right center;
      background: linear-gradient(
        -90deg,
        rgba(226, 232, 240, 0.96) 0%,
        #ffffff 12%,
        #f8fafc 85%,
        #e2e8f0 100%
      );
      box-shadow: 18px 8px 34px rgba(15, 23, 42, 0.28);
      animation: curlPageBackward 0.52s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes curlPageForward {
      0% {
        transform: rotateY(0deg) skewY(0deg);
        opacity: 0.95;
      }
      50% {
        transform: rotateY(-88deg) skewY(-4deg) scale(0.98);
        box-shadow: -22px 18px 40px rgba(15, 23, 42, 0.35);
        opacity: 1;
      }
      100% {
        transform: rotateY(-180deg) skewY(0deg);
        box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        opacity: 0;
      }
    }
    @keyframes curlPageBackward {
      0% {
        transform: rotateY(0deg) skewY(0deg);
        opacity: 0.95;
      }
      50% {
        transform: rotateY(88deg) skewY(4deg) scale(0.98);
        box-shadow: 22px 18px 40px rgba(15, 23, 42, 0.35);
        opacity: 1;
      }
      100% {
        transform: rotateY(180deg) skewY(0deg);
        opacity: 0;
      }
    }

    /* Page Navigation Click Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(4px);
      border: 1px solid #cbd5e1;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
    }
    .nav-arrow:hover {
      background: #2f732c;
      border-color: #2f732c;
      color: #ffffff;
      transform: translateY(-50%) scale(1.08);
    }
    .nav-arrow.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    .nav-arrow-left { left: 24px; }
    .nav-arrow-right { right: 24px; }

    /* Bottom Control Bar */
    .reader-footer {
      height: 54px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 0 1.5rem;
      color: #334155;
      z-index: 40;
      flex-shrink: 0;
    }
    .page-jump-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .page-jump-control strong {
      color: #0f172a !important;
    }
    .page-input {
      width: 50px;
      padding: 0.3rem 0.4rem;
      text-align: center;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #0f172a;
      font-weight: 700;
    }

    /* Table of Contents / Outline Drawer */
    .reader-drawer {
      position: fixed;
      top: 54px;
      bottom: 54px;
      left: 0;
      width: 320px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      box-shadow: 10px 0 30px rgba(15, 23, 42, 0.12);
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .reader-drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }
    .toc-item {
      display: block;
      padding: 0.6rem 0.85rem;
      color: #334155;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      transition: background 0.15s;
      cursor: pointer;
    }
    .toc-item:hover {
      background: #f1f5f9;
      color: #2f732c;
    }

    /* Loading Overlay */
    .reader-loading {
      position: absolute;
      inset: 0;
      background: rgba(248, 250, 252, 0.92);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      z-index: 60;
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(47, 115, 44, 0.2);
      border-top-color: #2f732c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Single Page Mode */
    @media (max-width: 768px) {
      .book-left-page {
        display: none !important;
      }
      .book-spine-crease {
        display: none;
      }
      .physical-book {
        padding: 8px;
        border-radius: 8px;
      }
      .nav-arrow {
        width: 40px;
        height: 40px;
      }
      .nav-arrow-left { left: 8px; }
      .nav-arrow-right { right: 8px; }
      .reader-progress-wrap {
        display: none;
      }
      .reader-drawer {
        width: 85vw;
        max-width: 320px;
      }
    }

    @media (max-width: 640px) {
      .reader-header {
        padding: 0 0.65rem;
        gap: 0.4rem;
      }
      .btn-reader-back {
        padding: 0.35rem 0.55rem;
        font-size: 0.75rem;
      }
      .reader-book-title {
        font-size: 0.82rem;
      }
      .reader-footer {
        gap: 0.75rem;
        padding: 0 0.75rem;
        font-size: 0.8rem;
      }
      .book-left-page, .book-right-page {
        min-width: 0;
        min-height: 300px;
      }
    }
  </style>
</head>
<body>

  <div id="readerApp">
    <!-- Header -->
    <header class="reader-header">
      <div class="reader-header-left">
        <a href="student-dashboard.html" class="btn-reader-back" title="Return to My Library">
          ← Back to Library
        </a>
        <div class="reader-book-info">
          <span id="readerBookTitle" class="reader-book-title">Loading Book...</span>
          <span id="readerBookAuthor" class="reader-book-author">Bethesda Bible Institute</span>
        </div>
      </div>

      <div class="reader-header-center">
        <div class="reader-progress-wrap">
          <span style="font-size:0.75rem; color:#94a3b8;">Reading Progress:</span>
          <div class="reader-progress-bar">
            <div id="readerProgressFill" class="reader-progress-fill"></div>
          </div>
          <span id="readerProgressText" class="reader-progress-text">0%</span>
        </div>
      </div>

      <div class="reader-header-right">
        <button type="button" id="btnToggleToc" class="tool-btn" title="Table of Contents">
          📑 Contents
        </button>
        <button type="button" id="btnZoomOut" class="tool-btn" title="Zoom Out">
          🔍−
        </button>
        <button type="button" id="btnZoomIn" class="tool-btn" title="Zoom In">
          🔍+
        </button>
        <button type="button" id="btnToggleFullscreen" class="tool-btn" title="Fullscreen">
          ⛶ Fullscreen
        </button>
      </div>
    </header>

    <!-- Reader Main Viewport -->
    <main class="reader-viewport" id="viewport">
      <!-- Nav Arrows -->
      <button type="button" id="btnPrevPage" class="nav-arrow nav-arrow-left" title="Previous Page (Left Arrow)">
        ◀
      </button>
      <button type="button" id="btnNextPage" class="nav-arrow nav-arrow-right" title="Next Page (Right Arrow)">
        ▶
      </button>

      <!-- Physical Open Book Container (Academic Green Hardcover Binding) -->
      <div class="physical-book" id="physicalBook">
        <div class="book-pages-wrapper">
          <!-- Central Spine Shadow -->
          <div class="book-spine-crease"></div>

          <!-- Left Page -->
          <div class="book-left-page" id="leftPageBox">
            <canvas id="canvasLeft" class="book-page-canvas"></canvas>
          </div>

          <!-- Right Page -->
          <div class="book-right-page" id="rightPageBox">
            <canvas id="canvasRight" class="book-page-canvas"></canvas>
            <div id="pageCornerPeel" class="page-corner-peel" title="Turn Page"></div>
          </div>

          <!-- 3D Page Turn Leaf Overlay -->
          <div id="pageTurnOverlay" class="page-turn-overlay"></div>
        </div>
      </div>

      <!-- Loading State with Percentage Progress Bar -->
      <div id="readerLoading" class="reader-loading">
        <div style="background:#FFFFFF; border:1px solid #e2e8f0; border-radius:14px; padding:2.5rem 2rem; box-shadow:0 20px 40px rgba(0,0,0,0.12); max-width:480px; width:90%; text-align:center;">
          <div style="font-size:2.4rem; margin-bottom:0.75rem;">📖</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; font-weight:700; font-size:0.95rem; color:#0f172a;">
            <span id="modalLoadingProgressStatus">Opening Book in 3D Reader...</span>
            <span id="modalLoadingProgressPercent" style="color:#286425; font-family:var(--font-mono, monospace); font-size:1.05rem;">15%</span>
          </div>
          <div style="width:100%; height:12px; background:#f1f5f9; border-radius:8px; overflow:hidden; border:1px solid #cbd5e1; padding:2px; box-sizing:border-box;">
            <div id="modalLoadingProgressFill" style="width:15%; height:100%; background:linear-gradient(90deg, #286425, #c5a059); border-radius:6px; transition:width 0.2s ease-out;"></div>
          </div>
          <p id="modalLoadingProgressSubtext" style="margin-top:0.75rem; font-size:0.82rem; color:#64748b; margin-bottom:0;">
            Verifying active enrollment and streaming authorized pages...
          </p>
        </div>
      </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="reader-footer">
      <div class="page-jump-control">
        <span>Page</span>
        <input type="number" id="inputCurrentPage" class="page-input" min="1" value="1">
        <span>of <strong id="labelTotalPages" style="color:#FFFFFF;">—</strong></span>
      </div>

      <div style="display:flex; gap:0.5rem;">
        <button type="button" id="btnFooterPrev" class="tool-btn">◀ Previous</button>
        <button type="button" id="btnFooterNext" class="tool-btn">Next ▶</button>
      </div>
    </footer>

    <!-- Outline / TOC Drawer -->
    <aside id="readerDrawer" class="reader-drawer">
      <div class="drawer-header">
        <span>Table of Contents</span>
        <button type="button" id="btnCloseDrawer" style="background:none; border:none; color:#cbd5e1; font-size:1.1rem; cursor:pointer;">✕</button>
      </div>
      <div class="drawer-content" id="tocContainer">
        <p style="font-size:0.85rem; color:#94a3b8; text-align:center; padding:2rem 0;">No outline found in this document.</p>
      </div>
    </aside>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/courses.js"></script>
  <script>
    // Set PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');

      if (!bookId) {
        alert('No book ID specified. Returning to student dashboard.');
        window.location.href = 'student-dashboard.html';
        return;
      }

      // Check student authentication
      const token = getAuthToken();
      if (!token) {
        alert('Student authentication required to read enrolled books.');
        window.location.href = `student-login.html?returnUrl=${encodeURIComponent(window.location.href)}`;
        return;
      }

      const canvasLeft = document.getElementById('canvasLeft');
      const canvasRight = document.getElementById('canvasRight');
      const leftCtx = canvasLeft.getContext('2d');
      const rightCtx = canvasRight.getContext('2d');

      let pdfDoc = null;
      let currentPage = 1;
      let totalPages = 1;
      let zoomScale = 1.0;
      let isRendering = false;
      let saveProgressTimer = null;

      // Reader Percentage Loading Controller
      let readerProgress = 15;
      let readerProgressInterval = null;

      function updateReaderProgress(pct, statusText, subText) {
        readerProgress = Math.max(readerProgress, pct);
        const fill = document.getElementById('modalLoadingProgressFill');
        const text = document.getElementById('modalLoadingProgressPercent');
        const status = document.getElementById('modalLoadingProgressStatus');
        const sub = document.getElementById('modalLoadingProgressSubtext');

        if (fill) fill.style.width = `${Math.min(100, readerProgress)}%`;
        if (text) text.textContent = `${Math.round(Math.min(100, readerProgress))}%`;
        if (status && statusText) status.textContent = statusText;
        if (sub && subText) sub.textContent = subText;
      }

      function startReaderProgress() {
        updateReaderProgress(15, 'Opening Book in 3D Reader...', 'Verifying active enrollment and streaming authorized pages...');
        readerProgressInterval = setInterval(() => {
          if (readerProgress < 90) {
            readerProgress += Math.floor(Math.random() * 8) + 4;
            if (readerProgress >= 40 && readerProgress < 70) {
              updateReaderProgress(readerProgress, 'Streaming Authorized Pages...', 'Loading encrypted PDF document stream...');
            } else if (readerProgress >= 70) {
              updateReaderProgress(readerProgress, 'Preparing 3D Reader Canvas...', 'Initializing pages and reading position...');
            } else {
              updateReaderProgress(readerProgress);
            }
          }
        }, 120);
      }

      function finishReaderProgress() {
        if (readerProgressInterval) clearInterval(readerProgressInterval);
        updateReaderProgress(100, '✓ Complete! Book Ready', 'Rendering high-resolution 3D pages...');
      }

      startReaderProgress();

      // Parallelize Metadata, Saved Progress, and PDF Stream request
      const metadataTask = (async () => {
        try {
          const bookData = (typeof getCourseById === 'function' ? getCourseById(bookId) : null) || (await fetchCourseDetailLive(bookId));
          if (bookData) {
            document.getElementById('readerBookTitle').textContent = bookData.title || 'eBook Reader';
            document.getElementById('readerBookAuthor').textContent = `By ${bookData.author || 'Bethesda Bible Faculty'}`;
            document.title = `${bookData.title} | Online Book Reader`;
          }
        } catch (e) {}
      })();

      const progressTask = (async () => {
        try {
          const progress = await apiFetchBookProgress(bookId);
          if (progress && progress.lastReadPage > 0) {
            currentPage = progress.lastReadPage;
          }
        } catch (e) {}
      })();

      // Stream PDF directly to PDF.js with Range Requests enabled
      try {
        const pdfStreamUrl = apiGetStudentBookPdfUrl(bookId);

        const loadingTask = pdfjsLib.getDocument({
          url: pdfStreamUrl,
          httpHeaders: {
            Authorization: `Bearer ${token}`
          },
          withCredentials: true,
          disableAutoFetch: false,
          disableStream: false,
          disableRange: false,
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true,
        });

        loadingTask.onProgress = (progressData) => {
          if (progressData && progressData.total > 0) {
            const pct = Math.round((progressData.loaded / progressData.total) * 90);
            updateReaderProgress(Math.max(readerProgress, pct), 'Streaming Authorized Pages...', `Received ${Math.round(progressData.loaded / 1024)} KB of ${Math.round(progressData.total / 1024)} KB`);
          }
        };

        // Wait for metadata, progress, and PDF header in parallel
        const [, , doc] = await Promise.all([metadataTask, progressTask, loadingTask.promise]);
        pdfDoc = doc;
        totalPages = pdfDoc.numPages;
        document.getElementById('labelTotalPages').textContent = totalPages;
        document.getElementById('inputCurrentPage').max = totalPages;

        if (currentPage > totalPages) currentPage = totalPages;

        // Render TOC if present
        try {
          const outline = await pdfDoc.getOutline();
          renderOutline(outline);
        } catch (e) {}

        finishReaderProgress();
        await new Promise((r) => setTimeout(r, 180));

        // Hide loading
        document.getElementById('readerLoading').style.display = 'none';

        // Render current spread
        await renderSpread(currentPage);
      } catch (err) {
        document.getElementById('readerLoading').innerHTML = `
          <div style="text-align:center; max-width:440px; padding:2rem;">
            <div style="font-size:3rem; margin-bottom:1rem;">⚠️</div>
            <h3 style="color:#FFF; font-size:1.35rem; margin-bottom:0.75rem;">Access Restricted</h3>
            <p style="color:#cbd5e1; font-size:0.95rem; line-height:1.5; margin-bottom:1.5rem;">
              ${err.message || 'You must be enrolled in this book course to read the full content.'}
            </p>
            <a href="book-details.html?id=${encodeURIComponent(bookId)}" class="btn btn-gold btn-md">
              Purchase or Enroll in Book
            </a>
          </div>
        `;
      }

      // Check viewport mode: Dual page on desktop vs Single page on mobile
      function isDualPageMode() {
        return window.innerWidth >= 768;
      }

      async function renderPageToCanvas(pageNum, canvas, ctx) {
        if (!pdfDoc || pageNum < 1 || pageNum > totalPages) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.width = 400;
          canvas.height = 550;
          ctx.fillStyle = '#fdfbf7';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          return;
        }

        const page = await pdfDoc.getPage(pageNum);
        const baseViewport = page.getViewport({ scale: 1.0 });

        // Calculate responsive scale based on viewport height
        const targetHeight = Math.max(380, window.innerHeight - 200) * zoomScale;
        const scale = targetHeight / baseViewport.height;
        const viewport = page.getViewport({ scale });

        const outputScale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        await page.render({
          canvasContext: ctx,
          transform,
          viewport,
        }).promise;
      }

      async function renderSpread(targetPage) {
        if (isRendering || !pdfDoc) return;
        isRendering = true;

        const dual = isDualPageMode();
        let leftPageNum, rightPageNum;

        if (dual) {
          // Open book spread: odd page on left, even on right (or 1 on right like a title page)
          if (targetPage === 1) {
            leftPageNum = 0; // Blank or inside cover
            rightPageNum = 1;
          } else if (targetPage % 2 === 0) {
            leftPageNum = targetPage;
            rightPageNum = targetPage + 1 <= totalPages ? targetPage + 1 : 0;
          } else {
            leftPageNum = targetPage - 1;
            rightPageNum = targetPage;
          }
          document.getElementById('leftPageBox').style.display = 'flex';
        } else {
          leftPageNum = 0;
          rightPageNum = targetPage;
          document.getElementById('leftPageBox').style.display = 'none';
        }

        try {
          if (dual && leftPageNum > 0) {
            await renderPageToCanvas(leftPageNum, canvasLeft, leftCtx);
          } else if (dual) {
            leftCtx.fillStyle = '#fdfbf7';
            leftCtx.fillRect(0, 0, canvasLeft.width, canvasLeft.height);
          }

          await renderPageToCanvas(rightPageNum, canvasRight, rightCtx);
        } catch (e) {
          console.error('Error rendering page spread:', e);
        } finally {
          isRendering = false;
        }

        // Update UI counters
        currentPage = targetPage;
        document.getElementById('inputCurrentPage').value = currentPage;
        const pct = Math.min(100, Math.round((currentPage / totalPages) * 100));
        document.getElementById('readerProgressFill').style.width = `${pct}%`;
        document.getElementById('readerProgressText').textContent = `${pct}%`;

        // Update arrow states & corner peel hint
        document.getElementById('btnPrevPage').classList.toggle('disabled', currentPage <= 1);
        document.getElementById('btnNextPage').classList.toggle('disabled', currentPage >= totalPages);
        const cornerPeel = document.getElementById('pageCornerPeel');
        if (cornerPeel) {
          cornerPeel.classList.toggle('hidden', currentPage >= totalPages);
        }

        // Schedule auto-saving reading progress
        scheduleAutoSave(currentPage);
      }

      function scheduleAutoSave(page) {
        if (saveProgressTimer) clearTimeout(saveProgressTimer);
        saveProgressTimer = setTimeout(async () => {
          try {
            await apiSaveBookProgress(bookId, { lastReadPage: page, totalPages });
          } catch (e) {}
        }, 1200);
      }

      // 3D Page Turn Navigation
      async function flipNext() {
        if (currentPage >= totalPages) return;
        const overlay = document.getElementById('pageTurnOverlay');
        overlay.className = 'page-turn-overlay flipping-next';

        const step = isDualPageMode() && currentPage > 1 ? 2 : 1;
        const target = Math.min(totalPages, currentPage + step);

        setTimeout(async () => {
          await renderSpread(target);
          overlay.className = 'page-turn-overlay';
        }, 300);
      }

      async function flipPrev() {
        if (currentPage <= 1) return;
        const overlay = document.getElementById('pageTurnOverlay');
        overlay.className = 'page-turn-overlay flipping-prev';

        const step = isDualPageMode() && currentPage > 2 ? 2 : 1;
        const target = Math.max(1, currentPage - step);

        setTimeout(async () => {
          await renderSpread(target);
          overlay.className = 'page-turn-overlay';
        }, 300);
      }

      // Event Listeners
      document.getElementById('btnNextPage').addEventListener('click', flipNext);
      document.getElementById('btnPrevPage').addEventListener('click', flipPrev);
      document.getElementById('btnFooterNext').addEventListener('click', flipNext);
      document.getElementById('btnFooterPrev').addEventListener('click', flipPrev);
      document.getElementById('rightPageBox').addEventListener('click', flipNext);
      document.getElementById('leftPageBox').addEventListener('click', flipPrev);

      // Keyboard arrow navigation
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          flipNext();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          flipPrev();
        }
      });

      // Jump to page input
      const inputPage = document.getElementById('inputCurrentPage');
      inputPage.addEventListener('change', () => {
        let val = parseInt(inputPage.value, 10);
        if (isNaN(val)) val = 1;
        val = Math.max(1, Math.min(totalPages, val));
        renderSpread(val);
      });

      // Zoom controls
      document.getElementById('btnZoomIn').addEventListener('click', () => {
        zoomScale = Math.min(2.0, zoomScale + 0.15);
        renderSpread(currentPage);
      });
      document.getElementById('btnZoomOut').addEventListener('click', () => {
        zoomScale = Math.max(0.65, zoomScale - 0.15);
        renderSpread(currentPage);
      });

      // Fullscreen toggle
      document.getElementById('btnToggleFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // Table of Contents Drawer
      const drawer = document.getElementById('readerDrawer');
      document.getElementById('btnToggleToc').addEventListener('click', () => {
        drawer.classList.toggle('open');
      });
      document.getElementById('btnCloseDrawer').addEventListener('click', () => {
        drawer.classList.remove('open');
      });

      function renderOutline(outline) {
        const container = document.getElementById('tocContainer');
        if (!outline || outline.length === 0) return;
        container.innerHTML = outline.map(item => {
          return `
            <a class="toc-item" data-dest="${item.dest || ''}">
              ${item.title}
            </a>
          `;
        }).join('');

        container.querySelectorAll('.toc-item').forEach((el, idx) => {
          el.addEventListener('click', async () => {
            drawer.classList.remove('open');
            try {
              const dest = outline[idx].dest;
              if (dest) {
                const pageRef = typeof dest === 'string' ? await pdfDoc.getDestination(dest) : dest;
                if (pageRef && pageRef[0]) {
                  const pageIndex = await pdfDoc.getPageIndex(pageRef[0]);
                  renderSpread(pageIndex + 1);
                }
              }
            } catch (e) {}
          });
        });
      }

      // Save on window unload
      window.addEventListener('beforeunload', () => {
        if (currentPage > 0) {
          navigator.sendBeacon?.(
            `${BIBLE_LMS_API_BASE}/students/books/${encodeURIComponent(bookId)}/progress`,
            JSON.stringify({ lastReadPage: currentPage, totalPages })
          );
        }
      });

      // Resize listener
      window.addEventListener('resize', () => {
        renderSpread(currentPage);
      });
    });
  </script>
</body>
</html>
